<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDBLOOM — survive the swarm, slay the Bloom Titan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 25,27 16,21 7,27' fill='%23ff5d8f'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #070312;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
